# SERVICE_CONNECTIONS.yaml — timeline-service
# Format mirrors the master SERVICE_CONNECTIONS_MAP.yaml at the repo root.

service: timeline-service
description: >
  Immutable chronological audit log for every lead's lifecycle journey.
  Passive subscriber to all major domain events — never produces outbound domain events.

subscribes_to:
  - topic: perc.lead-events
    from_service: lead-capture-service
    filter: none
    action: "Logs LEAD_CAPTURED or LEAD_MESSAGE_RECEIVED timeline entry"

  - topic: perc.response.sent
    from_service: response-service
    filter: none
    action: "Logs RESPONSE_SENT audit entry"

  - topic: perc.followup.sent
    from_service: response-service
    filter: none
    action: "Logs FOLLOWUP_SENT audit entry"

  - topic: perc.followup.action-required
    from_service: followup-service
    filter: none
    action: "Logs FOLLOWUP_DISPATCH_REQUESTED audit entry"

  - topic: perc.meeting-events
    from_service: meeting-service
    filter: none
    action: "Logs MEETING_BOOKED or MEETING_COMPLETED audit entry"

  - topic: perc.notification.notification-delivered
    from_service: notification-service
    filter: none
    action: "Logs NOTIFICATION_SENT / WEB_PUSH_DELIVERED audit entry"

  - topic: perc.workflow.status-updated
    from_service: workflow-service
    filter: none
    action: "Logs WORKFLOW_STATUS_CHANGED audit entry"

  - topic: perc.timeline.events
    from_service: any
    filter: none
    action: "Accepts direct structured timeline event ingestion commands"

produces: []  # Passive audit sink — no domain event output
